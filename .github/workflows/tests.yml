name: tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PINECONE_API_KEY: test-pinecone-key-not-used
      OPENAI_API_KEY: sk-test-key-not-used
      API_KEYS: 0123456789abcdef0123456789abcdef:ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python modules
        run: python -m compileall -q app tests
      - name: Run tests
        run: python -m pytest -q
